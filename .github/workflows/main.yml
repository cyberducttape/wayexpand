name: Sync Launchpad

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          LAUNCHPAD_SSH_KEY_B64: ${{ secrets.LAUNCHPAD_SSH_KEY_B64 }}
          LAUNCHPAD_KNOWN_HOSTS: ${{ secrets.LAUNCHPAD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$LAUNCHPAD_SSH_KEY_B64" | base64 --decode > ~/.ssh/launchpad_key
          printf '%s\n' "$LAUNCHPAD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/launchpad_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host git.launchpad.net
            User cyberducttape
            IdentityFile ~/.ssh/launchpad_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Launchpad SSH authorization
        run: |
          test -s ~/.ssh/launchpad_key
          fingerprint="$(ssh-keygen -y -f ~/.ssh/launchpad_key | ssh-keygen -lf - | awk '{print $2}')"
          echo "Launchpad key fingerprint: $fingerprint"
          set +e
          response="$(ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -i ~/.ssh/launchpad_key \
            -T cyberducttape@git.launchpad.net 2>&1)"
          set -e
          printf '%s\n' "$response"
          # Launchpad may return different SSH statuses for its intentional
          # no-shell response; the authenticated server text is the stable
          # success signal. Permission and host-key failures do not emit it.
          if ! printf '%s\n' "$response" | grep -Fq 'No shells on this server.'; then
            echo 'Launchpad SSH authorization did not succeed.' >&2
            exit 1
          fi

      - name: Push GitHub main to Launchpad
        env:
          GIT_SSH_COMMAND: ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/launchpad_key
        run: |
          set -euo pipefail
          git remote add launchpad \
            ssh://cyberducttape@git.launchpad.net/~cyberducttape/+git/wayexpand
          # GitHub is the canonical repository.  This explicit lease also
          # repairs a deliberate GitHub history rewrite (for example, when
          # commit identities are normalized) while refusing to overwrite a
          # Launchpad update that races the read below.
          launchpad_main="$(git ls-remote launchpad refs/heads/main \
            | awk 'NR == 1 { print $1 }')"
          if [ -n "$launchpad_main" ]; then
            timeout --signal=TERM --kill-after=30s 5m git push launchpad \
              --force-with-lease="refs/heads/main:$launchpad_main" \
              HEAD:refs/heads/main
          else
            timeout --signal=TERM --kill-after=30s 5m git push launchpad HEAD:refs/heads/main
          fi

          # Read the complete remote tag set once.  Opening one SSH session
          # per historical tag made this job unnecessarily slow and could
          # leave a successful mirror looking hung on Launchpad.
          remote_tags="$RUNNER_TEMP/wayexpand-launchpad-tags.txt"
          git ls-remote --tags launchpad >"$remote_tags"
          tag_pushes=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            local_commit="$(git rev-list -1 "${tag}^{commit}")"
            remote_commit="$(awk -v ref="refs/tags/${tag}" \
              '$2 == ref "^{}" { print $1; exit }' "$remote_tags")"
            remote_commit="${remote_commit:-$(awk -v ref="refs/tags/${tag}" \
              '$2 == ref { print $1; exit }' "$remote_tags")}"
            if [ -n "$remote_commit" ]; then
              if [ "$remote_commit" != "$local_commit" ]; then
                echo "Launchpad tag $tag points to $remote_commit; GitHub points to $local_commit." >&2
                echo 'Refusing to overwrite a divergent existing tag.' >&2
                exit 1
              fi
              echo "Launchpad tag $tag already matches; skipping."
            else
              tag_pushes+=("refs/tags/$tag:refs/tags/$tag")
            fi
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/tags)
          if [ "${#tag_pushes[@]}" -gt 0 ]; then
            timeout --signal=TERM --kill-after=30s 5m git push launchpad "${tag_pushes[@]}"
          fi
