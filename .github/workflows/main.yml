name: Sync Launchpad

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          LAUNCHPAD_SSH_KEY_B64: ${{ secrets.LAUNCHPAD_SSH_KEY_B64 }}
          LAUNCHPAD_KNOWN_HOSTS: ${{ secrets.LAUNCHPAD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$LAUNCHPAD_SSH_KEY_B64" | base64 --decode > ~/.ssh/launchpad_key
          printf '%s\n' "$LAUNCHPAD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/launchpad_key ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/launchpad_key

      - name: Push GitHub main to Launchpad
        run: |
          git remote add launchpad \
            ssh://cyberducttape@git.launchpad.net/~cyberducttape/+git/wayexpand
          git push launchpad \
            refs/heads/main:refs/heads/main
          git push launchpad \
            'refs/tags/*:refs/tags/*'
