name: Sync Launchpad

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          LAUNCHPAD_SSH_KEY_B64: ${{ secrets.LAUNCHPAD_SSH_KEY_B64 }}
          LAUNCHPAD_KNOWN_HOSTS: ${{ secrets.LAUNCHPAD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$LAUNCHPAD_SSH_KEY_B64" | base64 --decode > ~/.ssh/launchpad_key
          printf '%s\n' "$LAUNCHPAD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/launchpad_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host git.launchpad.net
            User cyberducttape
            IdentityFile ~/.ssh/launchpad_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Launchpad SSH authorization
        run: |
          test -s ~/.ssh/launchpad_key
          fingerprint="$(ssh-keygen -y -f ~/.ssh/launchpad_key | ssh-keygen -lf - | awk '{print $2}')"
          echo "Launchpad key fingerprint: $fingerprint"
          set +e
          response="$(ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -i ~/.ssh/launchpad_key \
            -T cyberducttape@git.launchpad.net 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$response"
          if [ "$status" -ne 1 ] || ! printf '%s\n' "$response" | grep -Fq 'No shells on this server.'; then
            echo 'Launchpad SSH authorization did not succeed.' >&2
            exit 1
          fi

      - name: Push GitHub main to Launchpad
        env:
          GIT_SSH_COMMAND: ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/launchpad_key
        run: |
          git remote add launchpad \
            ssh://cyberducttape@git.launchpad.net/~cyberducttape/+git/wayexpand
          git push launchpad \
            refs/heads/main:refs/heads/main
          git push launchpad \
            'refs/tags/*:refs/tags/*'
