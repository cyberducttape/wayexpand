name: Sync Launchpad

on:
  workflow_dispatch:
    inputs:
      replace_tag:
        description: >-
          Replace this one existing Launchpad tag with GitHub's (for a release
          tag that was moved on GitHub). Leave empty for a normal sync.
        required: false
        default: ""
      replace_tag_launchpad_commit:
        description: >-
          The full commit the Launchpad tag points to now, as the sync's
          refusal message printed it. The tag is replaced only if it still
          points there.
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: launchpad-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          LAUNCHPAD_SSH_KEY_B64: ${{ secrets.LAUNCHPAD_SSH_KEY_B64 }}
          LAUNCHPAD_KNOWN_HOSTS: ${{ secrets.LAUNCHPAD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$LAUNCHPAD_SSH_KEY_B64" | base64 --decode > ~/.ssh/launchpad_key
          printf '%s\n' "$LAUNCHPAD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/launchpad_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host git.launchpad.net
            User cyberducttape
            IdentityFile ~/.ssh/launchpad_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Launchpad SSH authorization
        run: |
          test -s ~/.ssh/launchpad_key
          fingerprint="$(ssh-keygen -y -f ~/.ssh/launchpad_key | ssh-keygen -lf - | awk '{print $2}')"
          echo "Launchpad key fingerprint: $fingerprint"
          authorized=false
          for attempt in 1 2 3 4 5; do
            set +e
            response="$(timeout --signal=TERM --kill-after=10s 45s ssh \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -i ~/.ssh/launchpad_key \
              -T cyberducttape@git.launchpad.net 2>&1)"
            ssh_status=$?
            set -e
            printf '%s\n' "$response"
            # Launchpad may return different SSH statuses for its intentional
            # no-shell response; the authenticated server text is the stable
            # success signal. Permission and host-key failures do not emit it.
            if printf '%s\n' "$response" | grep -Fq 'No shells on this server.'; then
              authorized=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Launchpad SSH authorization attempt $attempt failed (status $ssh_status); retrying." >&2
              sleep $((attempt * 10))
            fi
          done
          if [ "$authorized" != true ]; then
            echo 'Launchpad SSH authorization failed after five attempts.' >&2
            exit 1
          fi

      - name: Push GitHub main to Launchpad
        env:
          GIT_SSH_COMMAND: ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/launchpad_key
          REPLACE_TAG: ${{ inputs.replace_tag }}
          REPLACE_TAG_LAUNCHPAD_COMMIT: ${{ inputs.replace_tag_launchpad_commit }}
        run: |
          set -euo pipefail
          replace_tag="${REPLACE_TAG:-}"
          replace_expected="${REPLACE_TAG_LAUNCHPAD_COMMIT:-}"
          if [ -n "$replace_tag" ] || [ -n "$replace_expected" ]; then
            if ! git check-ref-format "refs/tags/$replace_tag" \
              || ! git rev-parse -q --verify "refs/tags/$replace_tag" >/dev/null; then
              echo "replace_tag must name an existing GitHub tag." >&2
              exit 1
            fi
            if ! [[ "$replace_expected" =~ ^[0-9a-f]{40}$ ]]; then
              echo "replace_tag_launchpad_commit must be a full 40-character commit." >&2
              exit 1
            fi
          fi
          git remote add launchpad \
            ssh://cyberducttape@git.launchpad.net/~cyberducttape/+git/wayexpand
          retry_ls_remote() {
            local attempt output query_status
            for attempt in 1 2 3 4 5 6 7; do
              set +e
              output="$(timeout --signal=TERM --kill-after=15s 45s \
                git ls-remote "$@")"
              query_status=$?
              set -e
              if [ "$query_status" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$attempt" -lt 7 ]; then
                echo "Launchpad ref query attempt $attempt failed with status $query_status; retrying." >&2
                sleep $((attempt * 10))
              fi
            done
            return 1
          }
          retry_push() {
            local attempt
            for attempt in 1 2 3 4 5; do
              set +e
              timeout --signal=TERM --kill-after=30s 5m git push "$@"
              push_status=$?
              set -e
              if [ "$push_status" -eq 0 ]; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Launchpad push attempt $attempt failed with status $push_status; retrying." >&2
                sleep $((attempt * 10))
              fi
            done
            return 1
          }
          # A tag push checks out the tagged commit. Never use that detached
          # HEAD to update Launchpad main: an older release tag could rewind
          # the mirror. Main synchronization is only valid for a main-branch
          # push (or an explicit dispatch from that branch).
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # GitHub is the canonical repository. This explicit lease also
            # repairs a deliberate GitHub history rewrite (for example, when
            # commit identities are normalized) while refusing to overwrite a
            # Launchpad update that races the read below.
            launchpad_main="$(retry_ls_remote launchpad refs/heads/main \
              | awk 'NR == 1 { print $1 }')"
            if [ -n "$launchpad_main" ]; then
              retry_push launchpad \
                --force-with-lease="refs/heads/main:$launchpad_main" \
                HEAD:refs/heads/main
            else
              retry_push launchpad HEAD:refs/heads/main
            fi
          else
            echo "Skipping Launchpad main update for $GITHUB_REF; syncing tags only."
          fi

          # Read the complete remote tag set once.  Opening one SSH session
          # per historical tag made this job unnecessarily slow and could
          # leave a successful mirror looking hung on Launchpad.
          remote_tags="$RUNNER_TEMP/wayexpand-launchpad-tags.txt"
          retry_ls_remote --tags launchpad >"$remote_tags"
          tag_pushes=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            local_commit="$(git rev-list -1 "${tag}^{commit}")"
            remote_commit="$(awk -v ref="refs/tags/${tag}" \
              '$2 == ref "^{}" { print $1; exit }' "$remote_tags")"
            remote_commit="${remote_commit:-$(awk -v ref="refs/tags/${tag}" \
              '$2 == ref { print $1; exit }' "$remote_tags")}"
            if [ -n "$remote_commit" ]; then
              if [ "$remote_commit" != "$local_commit" ]; then
                echo "Launchpad tag $tag points to $remote_commit; GitHub points to $local_commit." >&2
                if [ "$tag" = "$replace_tag" ] && [ "$remote_commit" = "$replace_expected" ]; then
                  # The lease names the tag ref's current value (the tag
                  # object for an annotated tag), so a concurrent change on
                  # Launchpad makes the push fail instead of being lost.
                  remote_ref="$(awk -v ref="refs/tags/${tag}" \
                    '$2 == ref { print $1; exit }' "$remote_tags")"
                  echo "Replacing Launchpad tag $tag as requested."
                  retry_push launchpad \
                    --force-with-lease="refs/tags/$tag:$remote_ref" \
                    "+refs/tags/$tag:refs/tags/$tag"
                  continue
                fi
                echo 'Refusing to overwrite a divergent existing tag.' >&2
                echo "To replace it, run this workflow manually with replace_tag=$tag and replace_tag_launchpad_commit=$remote_commit." >&2
                exit 1
              fi
              echo "Launchpad tag $tag already matches; skipping."
            else
              tag_pushes+=("refs/tags/$tag:refs/tags/$tag")
            fi
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/tags)
          if [ "${#tag_pushes[@]}" -gt 0 ]; then
            retry_push launchpad "${tag_pushes[@]}"
          fi

      # The PPA recipe builds launchpad-vendored, not main: Launchpad builders
      # cannot reach crates.io, so the branch carries vendor/ and debian/.
      - name: Publish the vendored Launchpad build branch
        if: github.ref == 'refs/heads/main'
        env:
          GIT_SSH_COMMAND: ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/launchpad_key
          LAUNCHPAD_REMOTE: launchpad
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout --signal=TERM --kill-after=30s 10m \
                bash scripts/publish-launchpad-branch.sh; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Vendored branch publish attempt $attempt failed; retrying." >&2
              sleep $((attempt * 10))
            fi
          done
          exit 1
