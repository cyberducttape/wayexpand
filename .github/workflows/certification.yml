name: Compositor Certification

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Exact ref whose compositor behavior is being certified"
        required: false
        type: string
  workflow_dispatch:
  schedule:
    # Runner-provided GTK/Qt drivers remain mandatory; missing drivers fail
    # closed instead of producing a certification claim.
    - cron: "30 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  runner-preflight:
    name: Certification runner preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.runners.outputs.matrix }}
    steps:
      # Production-required compositors must have an online runner. Optional
      # ones are certified only when their runner is online: a matrix entry
      # without any runner would wait in the queue until GitHub cancels it,
      # holding every release behind an optional platform.
      - name: Select compositors with online runners
        id: runners
        env:
          CERTIFICATION_RUNNER_TOKEN: ${{ secrets.CERTIFICATION_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          production_targets=$(jq '[.targets[] | select(.production_certification_required == true)] | length' tests/certification/compositor-matrix.json)
          if [ "$production_targets" -eq 0 ]; then
            message='No declared compositor route currently meets WayExpand production certification requirements. The release gate remains blocked until a real-session route demonstrates sensitive-field handling, atomic replacement, and the required input/output contract.'
            echo "$message" >&2
            {
              echo '## Production compositor certification blocked'
              echo "$message"
              echo 'Compatibility jobs cannot satisfy this gate. Do not mark a route production-certified from protocol availability or headless tests.'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$CERTIFICATION_RUNNER_TOKEN" ]; then
            message='Missing CERTIFICATION_RUNNER_TOKEN. Configure a fine-grained token with repository Administration: read permission, then store it as this repository secret.'
            echo "$message" >&2
            {
              echo '## Compositor certification unavailable'
              echo "$message"
              echo 'No compositor runner was queried and no certification result was produced.'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export GH_TOKEN="$CERTIFICATION_RUNNER_TOKEN"
          if ! runners_json="$(gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"; then
            message='Could not list repository Actions runners. Verify that CERTIFICATION_RUNNER_TOKEN is valid and has repository Administration: read permission.'
            echo "$message" >&2
            {
              echo '## Compositor certification unavailable'
              echo "$message"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # compositor, certification backend, production required. These
          # compatibility jobs never satisfy the production release gate.
          targets='kde ibus false
          gnome ibus false
          sway evdev+wlroots false
          hyprland evdev+wlroots false'
          missing=()
          include='[]'
          while read -r compositor backend required; do
            if jq -e --arg compositor "$compositor" '
              any(.[].runners[];
                .status == "online"
                and (([.labels[].name] | index("wayexpand-certification")) != null)
                and (([.labels[].name] | index($compositor)) != null))
            ' <<<"$runners_json" >/dev/null; then
              include=$(jq -c --arg compositor "$compositor" --arg backend "$backend" \
                --argjson required "$required" \
                '. + [{compositor: $compositor, backend: $backend, production_required: $required}]' \
                <<<"$include")
            elif [ "$required" = true ]; then
              missing+=("$compositor")
            else
              echo "::notice::Skipping optional $compositor certification: no online runner"
            fi
          done <<<"$targets"
          if [ "${#missing[@]}" -gt 0 ]; then
            message="Missing online self-hosted certification runners for required compositors: ${missing[*]}"
            echo "$message" >&2
            echo 'Register runners with labels: wayexpand-certification plus the compositor label.' >&2
            {
              echo '## Compositor certification unavailable'
              echo "$message"
              echo 'Register online self-hosted runners with labels wayexpand-certification and the compositor name.'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'matrix=%s\n' "$(jq -c '{include: .}' <<<"$include")" >>"$GITHUB_OUTPUT"
          echo 'All production-required compositor certification runners are online.'

  certify:
    name: "${{ matrix.compositor }} certification"
    needs: runner-preflight
    runs-on: [self-hosted, wayexpand-certification, "${{ matrix.compositor }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runner-preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Build certification binaries
        id: build
        run: cargo build --locked -p wayexpand -p wayexpand-daemon -p wayexpand-backend-ibus
      - name: Exercise live KWin tracker lifecycle
        if: ${{ matrix.compositor == 'kde' }}
        run: >-
          cargo test --locked -p wayexpand-backend-kwin-window
          live_kwin_tracker_health_probe_detects_script_unload
          -- --ignored --nocapture
      - name: Require runner-provided compositor driver
        id: metadata
        env:
          EXPECTED_COMPOSITOR: ${{ matrix.compositor }}
        run: |
          set -eu
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          test -x "${WAYEXPAND_CERTIFICATION_DRIVER:?WAYEXPAND_CERTIFICATION_DRIVER is not configured on this runner}"
          test "${WAYEXPAND_CERTIFICATION_COMPOSITOR:?WAYEXPAND_CERTIFICATION_COMPOSITOR is not configured on this runner}" = "$EXPECTED_COMPOSITOR"
          test -n "${WAYEXPAND_CERTIFICATION_VERSION:?WAYEXPAND_CERTIFICATION_VERSION is not configured on this runner}"
          test -n "${WAYEXPAND_CERTIFICATION_LAYOUT:?WAYEXPAND_CERTIFICATION_LAYOUT is not configured on this runner}"
          test -n "${WAYEXPAND_CERTIFICATION_TARGET_APPS:?WAYEXPAND_CERTIFICATION_TARGET_APPS is not configured on this runner}"
      - name: Run every matrix scenario
        id: driver
        continue-on-error: true
        env:
          COMPOSITOR: ${{ matrix.compositor }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -eu
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          mkdir -p "$RUNNER_TEMP/wayexpand-certification"
          scripts/run-certification-driver.sh \
            --driver "$WAYEXPAND_CERTIFICATION_DRIVER" \
            --compositor "$COMPOSITOR" \
            --version "$WAYEXPAND_CERTIFICATION_VERSION" \
            --backend "$BACKEND" \
            --layout "$WAYEXPAND_CERTIFICATION_LAYOUT" \
            --target-apps "$WAYEXPAND_CERTIFICATION_TARGET_APPS" \
            --timeout 120 \
            --deadline 3600 \
            --output "$RUNNER_TEMP/wayexpand-certification/results.txt" \
            --log-dir "$RUNNER_TEMP/wayexpand-certification/driver-logs"
      - name: Collect machine-readable evidence
        if: always() && steps.build.outcome == 'success' && steps.metadata.outcome == 'success' && steps.driver.outcome != 'skipped'
        continue-on-error: ${{ matrix.production_required != true }}
        env:
          COMPOSITOR: ${{ matrix.compositor }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -eu
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          scripts/certify-compositor.sh --format json \
            --compositor "$COMPOSITOR" \
            --version "$WAYEXPAND_CERTIFICATION_VERSION" \
            --backend "$BACKEND" \
            --layout "$WAYEXPAND_CERTIFICATION_LAYOUT" \
            --target-apps "$WAYEXPAND_CERTIFICATION_TARGET_APPS" \
            --cli "$GITHUB_WORKSPACE/target/debug/wayexpand" \
            --results "$RUNNER_TEMP/wayexpand-certification/results.txt" \
            --output "$RUNNER_TEMP/wayexpand-certification/$COMPOSITOR.json"
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayexpand-certification-${{ matrix.compositor }}
          path: ${{ runner.temp }}/wayexpand-certification
          if-no-files-found: error
      - name: Require certified evidence
        if: always() && matrix.production_required == true
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/wayexpand-certification/${{ matrix.compositor }}.json
        run: |
          set -eu
          test -s "$EVIDENCE_FILE" || {
            echo "certification evidence was not produced" >&2
            exit 1
          }
          jq -e '.certified == true and .status == "certified" and
            .certification_scope == "production" and
            .production_eligible == true and
            .production_certification_required == true' "$EVIDENCE_FILE" >/dev/null || {
            echo "desktop certification is incomplete or failed; inspect the uploaded evidence artifact" >&2
            exit 1
          }
