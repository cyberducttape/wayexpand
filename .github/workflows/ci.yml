name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:
    inputs:
      checkout_ref:
        description: "Optional ref to check out for release verification"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Several tests exercise process-wide desktop/configuration state and
  # bounded worker resources. Keep CI deterministic across hosted runners;
  # coverage is unchanged.
  RUST_TEST_THREADS: 1

jobs:
  versions:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Check version consistency across all files
        run: |
          set -e

          # Extract versions from each file
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          pkgbuild_version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          debian_version=$(sed -n 's/^wayexpand (\([^ -]*\)-.*/\1/p' debian/changelog | head -n1)
          spec_version=$(sed -n 's/^Version: *//p' wayexpand.spec)
          ibus_version=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' desktop/wayexpand-ibus.xml | head -n1)
          appstream_version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' io.github.cyberducttape.WayExpand.metainfo.xml | head -n1)

          echo "Version check:"
          echo "  Cargo.toml:            $cargo_version"
          echo "  PKGBUILD:              $pkgbuild_version"
          echo "  debian/changelog:      $debian_version"
          echo "  wayexpand.spec:        $spec_version"
          echo "  IBus XML:              $ibus_version"
          echo "  AppStream metadata:    $appstream_version"

          # Verify all match
          test "$cargo_version" = "$pkgbuild_version" || exit 1
          test "$cargo_version" = "$debian_version" || exit 1
          test "$cargo_version" = "$spec_version" || exit 1
          test "$cargo_version" = "$ibus_version" || exit 1
          test "$cargo_version" = "$appstream_version" || exit 1

          echo "✓ All versions consistent"

  workflow:
    name: GitHub Actions Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Validate GitHub Actions
        run: |
          test -n "$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit)"
          while IFS= read -r workflow_file; do
            docker run --rm --workdir /repo --volume="$GITHUB_WORKSPACE:/repo" \
              rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
              "$workflow_file"
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print)

  supply-chain:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
      - name: Run cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Run cargo deny
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check

  rust:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests (locked, debug)
        run: cargo test --locked --workspace
      - name: Run tests (locked, release)
        run: cargo test --locked --release --workspace
      - name: Clippy (locked, debug)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (locked, release)
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: bash scripts/test-release.sh
      - name: UI help output
        run: cargo run --locked -q -p wayexpand-ui -- --help
      - name: GUI help output
        run: cargo run --locked -q -p wayexpand-gui -- --help

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Check workspace at MSRV
        run: cargo check --locked --workspace
      - name: Run workspace tests at MSRV
        run: cargo test --locked --workspace --release

  clean-source-build:
    name: Clean Source Build (no cache, no vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Create git archive (simulate release tarball)
        run: git archive HEAD --output=wayexpand.tar.gz
      - name: Extract to clean directory
        run: |
          mkdir -p /tmp/clean-build
          cd /tmp/clean-build
          tar -xzf "${GITHUB_WORKSPACE}/wayexpand.tar.gz"
          test ! -e .cargo/config.toml
          test ! -d vendor
      - name: Build with clean CARGO_HOME (no cache, no vendor)
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo build --locked --release
      - name: Test with clean CARGO_HOME
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo test --locked --release --workspace

  scripts:
    name: Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Reject legacy repository identity
        run: |
          legacy_identity=$(printf 'itchy%s' 'itchy123')
          if rg -n --hidden --glob '!.git/**' --glob '!target/**' "$legacy_identity" .; then
            echo "Legacy GitHub username found"
            exit 1
          fi
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net io.github.cyberducttape.WayExpand.metainfo.xml
          desktop-file-validate desktop/wayexpand.desktop
      - name: Check markdown links
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1
        with:
          args: --offline --exclude-link-local --exclude 'file:///' '*.md' '**/*.md'
          fail: true

  integration:
    name: Integration & System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Build binaries
        run: cargo build --locked --workspace
      - name: Daemon smoke test
        run: bash scripts/smoke-daemon.sh
      - name: Daemon E2E scenarios
        run: bash scripts/test-e2e.sh
      - name: Doctor smoke test
        run: bash scripts/test-doctor.sh
      - name: Certification JSON contract
        run: |
          jq -e '.schema == 1 and ([.targets[].id] | sort == ["gnome", "hyprland", "kde", "sway"]) and (.required_scenarios | length == 12)' tests/certification/compositor-matrix.json
          bash scripts/test-certification-report.sh target/debug/wayexpand
          bash scripts/certify-compositor.sh --help
          bash scripts/run-certification-driver.sh --help
          bash scripts/test-certification-matrix.sh
          bash scripts/test-certification.sh
          bash scripts/test-certification-driver.sh
      - name: TUI smoke test
        run: bash scripts/test-ui.sh
      - name: Installer test (user)
        run: bash scripts/test-install-user.sh
      - name: Installer test (release)
        run: bash scripts/test-install-release.sh
      - name: Distribution manifest check
        run: bash scripts/check-distribution-manifest.sh
      - name: Installer test (evdev permissions)
        run: bash scripts/test-install-evdev-permissions.sh

  systemd:
    name: Systemd Unit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Create dummy binaries for systemd verification
        run: |
          mkdir -p ~/.local/bin
          touch ~/.local/bin/wayexpand ~/.local/bin/wayexpand-daemon
          chmod +x ~/.local/bin/wayexpand ~/.local/bin/wayexpand-daemon
      - name: Verify wayexpand.service
        run: systemd-analyze verify systemd/wayexpand.service
      - name: Verify wayexpand-input-method.service
        run: systemd-analyze verify systemd/wayexpand-input-method.service
      - name: Verify wayexpand-evdev.service
        run: systemd-analyze verify systemd/wayexpand-evdev.service
      - name: Verify backend units are mutually exclusive
        run: |
          set -eu
          grep -Fx 'Conflicts=wayexpand-input-method.service wayexpand-evdev.service' systemd/wayexpand.service
          grep -Fx 'Conflicts=wayexpand.service wayexpand-evdev.service' systemd/wayexpand-input-method.service
          grep -Fx 'Conflicts=wayexpand.service wayexpand-input-method.service' systemd/wayexpand-evdev.service
      - name: Security profile analysis
        run: systemd-analyze security --offline=yes --no-pager systemd/wayexpand.service systemd/wayexpand-input-method.service systemd/wayexpand-evdev.service
      - name: Enforce hardening contract
        run: bash scripts/check-systemd-hardening.sh
      - name: Enforce libei token storage contract
        run: bash scripts/check-libei-token-paths.sh

  udev:
    name: udev Rules Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Verify udev rules
        run: udevadm verify udev/71-wayexpand-evdev.rules udev/69-wayexpand-evdev-uaccess.rules

  policy-docs:
    name: Documentation Policy Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Test documented policy shape
        run: cargo test --locked -p wayexpand-daemon policy::tests::load_policy_accepts_published_ansible_shape
