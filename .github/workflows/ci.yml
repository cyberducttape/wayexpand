name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  supply-chain:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests (locked, debug)
        run: cargo test --locked --workspace
      - name: Run tests (locked, release)
        run: cargo test --locked --release --workspace
      - name: Clippy (locked, debug)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (locked, release)
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: bash scripts/test-release.sh
      - name: UI help output
        run: cargo run --locked -q -p wayexpand-ui -- --help
      - name: GUI help output
        run: cargo run --locked -q -p wayexpand-gui -- --help

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Check workspace at MSRV
        run: cargo check --locked --workspace
      - name: Run workspace tests at MSRV
        run: cargo test --locked --workspace --release

  clean-source-build:
    name: Clean Source Build (no cache, no vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Create git archive (simulate release tarball)
        run: git archive HEAD --output=wayexpand.tar.gz
      - name: Extract to clean directory
        run: mkdir -p /tmp/clean-build && cd /tmp/clean-build && tar -xzf $GITHUB_WORKSPACE/wayexpand.tar.gz
      - name: Build with clean CARGO_HOME (no cache, no vendor)
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo build --locked --release
      - name: Test with clean CARGO_HOME
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo test --locked --release --workspace

  scripts:
    name: Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --offline --exclude-link-local --exclude 'file:///' docs/ README.md SECURITY.md
          fail: true

  integration:
    name: Integration & System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Daemon smoke test
        run: bash scripts/smoke-daemon.sh
      - name: Doctor smoke test
        run: bash scripts/test-doctor.sh
      - name: TUI smoke test
        run: bash scripts/test-ui.sh
      - name: Installer test (user)
        run: bash scripts/test-install-user.sh
      - name: Installer test (release)
        run: bash scripts/test-install-release.sh
      - name: Installer test (evdev permissions)
        run: bash scripts/test-install-evdev-permissions.sh

  systemd:
    name: Systemd Unit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify wayexpand.service
        run: systemd-analyze verify systemd/wayexpand.service
      - name: Verify wayexpand-input-method.service
        run: systemd-analyze verify systemd/wayexpand-input-method.service
      - name: Verify wayexpand-evdev.service
        run: systemd-analyze verify systemd/wayexpand-evdev.service
      - name: Security profile analysis
        run: systemd-analyze security --offline=yes --no-pager systemd/wayexpand.service systemd/wayexpand-input-method.service systemd/wayexpand-evdev.service

  udev:
    name: udev Rules Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify udev rules
        run: udevadm verify udev/71-wayexpand-evdev.rules

  policy-docs:
    name: Documentation Policy Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build CLI with policy validation
        run: cargo build --locked -p wayexpand
      - name: Test Ansible documentation policy example
        run: |
          # Create policy exactly as documented in ANSIBLE_INTEGRATION.md
          mkdir -p /tmp/policy-test
          cat > /tmp/policy-test/policy.toml <<'POLICY'
          [organization]
          safe_mode = true
          disable_hotkeys = false
          disable_title_matching = false
          max_replacement_size = 65536
          allowed_backends = ["input-method-v2", "libei"]
          POLICY

          # Set permissions as documented (0600)
          chmod 0600 /tmp/policy-test/policy.toml

          # Verify policy parses and permissions are correct
          ls -la /tmp/policy-test/policy.toml | grep -E '^\-rw-------'

          # Validate policy syntax (if CLI supports it)
          ./target/debug/wayexpand validate /tmp/policy-test/policy.toml 2>&1 | grep -qE '(valid|ok|success)' || echo "Policy validation command not available, skipping"
