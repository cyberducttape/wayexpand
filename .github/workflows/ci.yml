name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo test --locked --release --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo run --locked -q -p wayexpand-ui -- --help
      - run: cargo run --locked -q -p wayexpand-gui -- --help
      - run: shellcheck scripts/*.sh
      - run: bash scripts/smoke-daemon.sh
      - run: bash scripts/test-doctor.sh
      - run: bash scripts/test-ui.sh
      - run: bash scripts/test-install-user.sh
      - run: systemd-analyze verify systemd/wayexpand.service
      - run: systemd-analyze verify systemd/wayexpand-input-method.service
      - run: systemd-analyze security --offline=yes --no-pager systemd/wayexpand.service systemd/wayexpand-input-method.service
