name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:
    inputs:
      checkout_ref:
        description: "Optional ref to check out for release verification"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Several tests exercise process-wide desktop/configuration state and
  # bounded worker resources. Keep CI deterministic across hosted runners;
  # coverage is unchanged.
  RUST_TEST_THREADS: 1

jobs:
  versions:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Check version consistency across all files
        run: |
          set -e

          # Extract versions from each file
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          pkgbuild_version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          debian_version=$(sed -n 's/^wayexpand (\([^ -]*\)-.*/\1/p' debian/changelog | head -n1)
          spec_version=$(sed -n 's/^Version: *//p' wayexpand.spec)
          ibus_version=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' desktop/wayexpand-ibus.xml | head -n1)
          appstream_version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' io.github.cyberducttape.WayExpand.metainfo.xml | head -n1)

          echo "Version check:"
          echo "  Cargo.toml:            $cargo_version"
          echo "  PKGBUILD:              $pkgbuild_version"
          echo "  debian/changelog:      $debian_version"
          echo "  wayexpand.spec:        $spec_version"
          echo "  IBus XML:              $ibus_version"
          echo "  AppStream metadata:    $appstream_version"

          # Verify all match
          test "$cargo_version" = "$pkgbuild_version" || exit 1
          test "$cargo_version" = "$debian_version" || exit 1
          test "$cargo_version" = "$spec_version" || exit 1
          test "$cargo_version" = "$ibus_version" || exit 1
          test "$cargo_version" = "$appstream_version" || exit 1

          echo "✓ All versions consistent"

  aarch64-build:
    name: Native aarch64 build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p wayexpand-ui -p wayexpand-gui -p wayexpand-backend-ibus

  workflow:
    name: GitHub Actions Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Validate GitHub Actions
        run: |
          test -n "$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit)"
          while IFS= read -r workflow_file; do
            docker run --rm --workdir /repo --volume="$GITHUB_WORKSPACE:/repo" \
              rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
              "$workflow_file"
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print)

  supply-chain:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Run cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Run cargo deny
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check

  rust:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests (locked, debug)
        run: cargo test --locked --workspace
      - name: Test Action Broker build
        run: cargo test --locked -p action-broker
      - name: Action Broker end-to-end test
        run: bash scripts/test-action-broker-e2e.sh
      - name: Run tests (locked, release)
        run: cargo test --locked --release --workspace
      - name: Clippy (locked, debug)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (locked, release)
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: timeout --signal=TERM --kill-after=30s 15m bash scripts/test-release.sh
      - name: UI help output
        run: timeout --signal=TERM --kill-after=30s 2m cargo run --locked -q -p wayexpand-ui -- --help
      - name: GUI help output
        run: timeout --signal=TERM --kill-after=30s 2m cargo run --locked -q -p wayexpand-gui -- --help

  rust-concurrency:
    name: Concurrent Rust stress (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package:
          - action-broker
          - wayexpand-daemon
          - wayexpand-gui
          - wayexpand-core
          - wayexpand-ui
          - wayexpand-backend-ibus
          - wayexpand-backend-input-method
          - wayexpand-backend-libei
    env:
      # The default lane deliberately serializes tests that share desktop
      # state. This lane is the complementary race detector: packages here
      # must tolerate concurrent test execution and repeated worker churn.
      RUST_TEST_THREADS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Run concurrent tests repeatedly
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3; do
            echo "Concurrent stress iteration ${iteration}"
            cargo test --locked -p "${{ matrix.package }}" -- --test-threads=8
          done

  daemon-soak:
    name: Daemon soak (3 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Soak the daemon with typing, reloads, and control requests
        run: SOAK_SECONDS=180 bash scripts/soak-daemon.sh

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Check workspace at MSRV
        run: cargo check --locked --workspace
      - name: Run workspace tests at MSRV
        run: cargo test --locked --workspace --release

  clean-source-build:
    name: Clean Source Build (no cache, no vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Create git archive (simulate release tarball)
        run: git archive --format=tar HEAD | gzip -n > wayexpand.tar.gz
      - name: Extract to clean directory
        run: |
          mkdir -p /tmp/clean-build
          cd /tmp/clean-build
          tar -xzf "${GITHUB_WORKSPACE}/wayexpand.tar.gz"
          test ! -d .git
          test ! -e .cargo/config.toml
          test ! -d vendor
      - name: Build with clean CARGO_HOME (no cache, no vendor)
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo build --locked --release
      - name: Test with clean CARGO_HOME
        env:
          CARGO_HOME: /tmp/cargo-clean
        run: cd /tmp/clean-build && cargo test --locked --release --workspace

  scripts:
    name: Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh
      - name: Check Rust dependency hygiene
        run: cargo install cargo-machete --version 0.9.2 --locked && cargo machete
      - name: Test commit identity failure handling
        run: bash scripts/test-commit-identity.sh

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
      - name: Reject legacy repository identity
        run: |
          legacy_identity=$(printf 'itchy%s' 'itchy123')
          if rg -n --hidden --glob '!.git/**' --glob '!target/**' "$legacy_identity" .; then
            echo "Legacy GitHub username found"
            exit 1
          fi
      - name: Verify commit identity policy
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base='${{ github.event.before }}'
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base=''
          fi
          if [ -n "$base" ]; then
            bash scripts/check-commit-identity.sh "$base..HEAD"
          else
            bash scripts/check-commit-identity.sh HEAD
          fi
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net io.github.cyberducttape.WayExpand.metainfo.xml
          desktop-file-validate desktop/wayexpand.desktop
      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --exclude-link-local --exclude 'file:///' '*.md' '**/*.md'
          fail: true
      - name: Check local markdown links deterministically
        run: python3 scripts/check-markdown-links.py
      - name: Build CLI for executable documentation examples
        run: cargo build --locked -p wayexpand
      - name: Check documentation contracts
        run: python3 scripts/check-documentation-contracts.py

  integration:
    name: Integration & System Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Build binaries
        run: cargo build --locked --workspace
      - name: Daemon smoke test
        run: bash scripts/smoke-daemon.sh
      - name: Daemon E2E scenarios
        run: bash scripts/test-e2e.sh
      - name: Doctor smoke test
        run: bash scripts/test-doctor.sh
      - name: Library Git sync test
        run: bash scripts/test-sync.sh
      - name: Signed pack test
        run: bash scripts/test-pack-signing.sh
      - name: Certification JSON contract
        run: |
          jq -e '.schema == 1 and ([.targets[].id] | sort == ["gnome", "hyprland", "kde", "sway"]) and (.required_scenarios | length == 35)' tests/certification/compositor-matrix.json
          bash scripts/test-certification-report.sh target/debug/wayexpand
          bash scripts/certify-compositor.sh --help
          bash scripts/run-certification-driver.sh --help
          bash scripts/test-certification-matrix.sh
          bash scripts/test-certification.sh
          bash scripts/test-certification-driver.sh
      - name: TUI smoke test
        run: bash scripts/test-ui.sh
      - name: Installer test (user)
        run: bash scripts/test-install-user.sh
      - name: Installer test (release)
        run: bash scripts/test-install-release.sh
      - name: Distribution manifest check
        run: bash scripts/check-distribution-manifest.sh
      - name: Installer test (evdev permissions)
        run: bash scripts/test-install-evdev-permissions.sh

  packaging:
    name: Debian and RPM Package Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts \
            dpkg-dev rpm cpio libwayland-dev libxkbcommon-dev pkg-config
          rustc --version
          cargo --version
      - name: Vendor dependencies for offline package builds
        run: |
          # Never reuse an ignored vendor tree: stale crates can make frozen
          # RPM builds resolve against a version that is absent from Cargo.lock.
          rm -rf .cargo vendor
          mkdir -p .cargo
          cargo vendor vendor/ > .cargo/config.toml
      - name: Build Debian package
        run: |
          # The pinned rust-toolchain supplies rustc/cargo; -d bypasses the
          # runner's older Debian package metadata for those tools.
          dpkg-buildpackage -us -uc -b -d
          deb=$(find .. -maxdepth 1 -type f -name 'wayexpand_*.deb' -print -quit)
          test -n "$deb"
          for path in \
            '/usr/bin/wayexpand-install-evdev-access' \
            '/etc/wayexpand/expansions.toml.example' \
            '/usr/share/man/man1/wayexpand.1' \
            '/usr/lib/systemd/user/wayexpand-evdev.service' \
            '/usr/share/wayexpand/udev/71-wayexpand-evdev.rules' \
            '/usr/share/wayexpand/udev/69-wayexpand-evdev-uaccess.rules'; do
            dpkg-deb -c "$deb" | grep -F "$path"
          done
      - name: Build RPM package and inspect manifest
        run: |
          deb=$(find .. -maxdepth 1 -type f -name 'wayexpand_*.deb' -print -quit)
          test -n "$deb"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          top=$(mktemp -d)
          source_dir="$top/sources/wayexpand-${version}"
          mkdir -p "$source_dir" "$top/rpmbuild/SOURCES"
          git archive --format=tar HEAD | tar -x -C "$source_dir"
          test -f "$source_dir/docs/wayexpand.1"
          cp -a .cargo vendor "$source_dir/"
          tar -C "$top/sources" -czf "$top/rpmbuild/SOURCES/wayexpand-${version}-vendored.tar.gz" \
            "wayexpand-${version}"
          timeout --signal=TERM --kill-after=60s 20m rpmbuild -bb --nodeps \
            --define "_topdir $top/rpmbuild" \
            --define "_sourcedir $top/rpmbuild/SOURCES" \
            wayexpand.spec
          rpm=$(find "$top/rpmbuild/RPMS" -type f -name 'wayexpand-*.rpm' -print -quit)
          test -n "$rpm"
          for path in \
            '/usr/bin/wayexpand-install-evdev-access' \
            '/etc/wayexpand/expansions.toml.example' \
            '/usr/lib/systemd/user/wayexpand-evdev.service' \
            '/usr/share/wayexpand/udev/71-wayexpand-evdev.rules' \
            '/usr/share/wayexpand/udev/69-wayexpand-evdev-uaccess.rules'; do
            rpm -qlp "$rpm" | grep -F "$path"
          done
          rpm -qlp "$rpm" | grep -E '^/usr/share/man/man1/wayexpand\.1(\.gz)?$'
          deb_root=$(mktemp -d)
          dpkg-deb -x "$deb" "$deb_root"
          grep -Fx 'ExecStart=/usr/bin/wayexpand-daemon --source=input-method' \
            "$deb_root/usr/lib/systemd/user/wayexpand-input-method.service"
          grep -Fx 'ExecStart=/usr/bin/wayexpand-daemon --source=evdev --backend=libei --allow-evdev-sensitive-fields' \
            "$deb_root/usr/lib/systemd/user/wayexpand-evdev.service"
          grep -Fx 'ExecStart=/usr/bin/wayexpand-action-broker --config %h/.config/wayexpand/broker.toml --socket %t/wayexpand-broker.sock' \
            "$deb_root/usr/lib/systemd/user/wayexpand-action-broker.service"
          rpm_root=$(mktemp -d)
          (cd "$rpm_root" && rpm2cpio "$rpm" | cpio -idm --quiet)
          grep -Fx 'ExecStart=/usr/bin/wayexpand-daemon --source=input-method' \
            "$rpm_root/usr/lib/systemd/user/wayexpand-input-method.service"
          grep -Fx 'ExecStart=/usr/bin/wayexpand-daemon --source=evdev --backend=libei --allow-evdev-sensitive-fields' \
            "$rpm_root/usr/lib/systemd/user/wayexpand-evdev.service"
          grep -Fx 'ExecStart=/usr/bin/wayexpand-action-broker --config %h/.config/wayexpand/broker.toml --socket %t/wayexpand-broker.sock' \
            "$rpm_root/usr/lib/systemd/user/wayexpand-action-broker.service"

  systemd:
    name: Systemd Unit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # This lane builds without the workspace-wide vendor step. Hosted
      # runners occasionally terminate sparse-index HTTP/2 streams while
      # Cargo resolves the locked workspace; retries plus non-multiplexed HTTP
      # make the release gate deterministic without weakening --locked.
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Install broker build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build Action Broker for sandbox test
        run: cargo build --locked -p action-broker
      - name: Create dummy binaries for systemd verification
        run: |
          mkdir -p ~/.local/bin
          touch ~/.local/bin/wayexpand ~/.local/bin/wayexpand-daemon ~/.local/bin/wayexpand-action-broker
          chmod +x ~/.local/bin/wayexpand ~/.local/bin/wayexpand-daemon ~/.local/bin/wayexpand-action-broker
      - name: Verify wayexpand.service
        run: systemd-analyze verify systemd/wayexpand.service
      - name: Verify wayexpand-input-method.service
        run: systemd-analyze verify systemd/wayexpand-input-method.service
      - name: Verify wayexpand-evdev.service
        run: systemd-analyze verify systemd/wayexpand-evdev.service
      - name: Verify wayexpand-action-broker.service
        run: systemd-analyze verify systemd/wayexpand-action-broker.service
      - name: Verify backend units are mutually exclusive
        run: |
          set -eu
          grep -Fx 'Conflicts=wayexpand-input-method.service wayexpand-evdev.service' systemd/wayexpand.service
          grep -Fx 'Conflicts=wayexpand.service wayexpand-evdev.service' systemd/wayexpand-input-method.service
          grep -Fx 'Conflicts=wayexpand.service wayexpand-input-method.service' systemd/wayexpand-evdev.service
      - name: Security profile analysis
        run: systemd-analyze security --offline=yes --no-pager systemd/wayexpand.service systemd/wayexpand-input-method.service systemd/wayexpand-evdev.service systemd/wayexpand-action-broker.service
      - name: Enforce hardening contract
        run: bash scripts/check-systemd-hardening.sh
      - name: Enforce libei token storage contract
        run: bash scripts/check-libei-token-paths.sh
      - name: Test Action Broker audit under service sandbox
        run: bash scripts/test-action-broker-systemd-audit.sh

  udev:
    name: udev Rules Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Verify udev rules
        run: udevadm verify udev/71-wayexpand-evdev.rules udev/69-wayexpand-evdev-uaccess.rules

  policy-docs:
    name: Documentation Policy Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Test documented policy shape
        run: cargo test --locked -p wayexpand-daemon policy::tests::load_policy_accepts_published_ansible_shape
