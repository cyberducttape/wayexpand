name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  linux-x86_64:
    name: Linux x86_64 release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$actual" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match workspace version $actual" >&2
            exit 1
          }
          # debian/changelog is what Launchpad's PPA builds key off of, not
          # this tag or Cargo.toml -- a tag can pass the Cargo.toml check
          # above and still leave Launchpad building a stale version if this
          # file wasn't bumped in the same commit (this happened for
          # v1.0.1/v1.1.0/v1.1.1, which all still said 1.0.0 here).
          changelog_version=$(dpkg-parsechangelog --show-field Version)
          changelog_upstream="${changelog_version%%-*}"
          test "$changelog_upstream" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match debian/changelog version $changelog_version" >&2
            echo "Launchpad builds from debian/changelog, not this tag -- bump it in the same commit you tag." >&2
            exit 1
          }
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p wayexpand-ui -p wayexpand-gui
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="wayexpand-${version}-linux-x86_64"
          mkdir -p "$root/bin" "$root/systemd" "$root/desktop" "$root/docs" "$root/scripts" "$root/udev"
          install -m 0755 target/release/wayexpand "$root/bin/"
          install -m 0755 target/release/wayexpand-daemon "$root/bin/"
          install -m 0755 target/release/wayexpand-ui "$root/bin/"
          install -m 0755 target/release/wayexpand-gui "$root/bin/"
          install -m 0644 systemd/*.service "$root/systemd/"
          install -m 0644 desktop/wayexpand.desktop "$root/desktop/"
          install -m 0644 README.md LICENSE SECURITY.md CHANGELOG.md "$root/"
          install -m 0600 expansions.toml "$root/expansions.toml"
          install -m 0755 scripts/install-release.sh "$root/scripts/"
          install -m 0755 scripts/uninstall-user.sh "$root/scripts/"
          install -m 0755 scripts/install-evdev-permissions.sh "$root/scripts/"
          install -m 0644 udev/71-wayexpand-evdev.rules "$root/udev/"
          cp -R docs/. "$root/docs/"
          tar -czf "${root}.tar.gz" "$root"
          sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            wayexpand-*.tar.gz
            wayexpand-*.sha256
