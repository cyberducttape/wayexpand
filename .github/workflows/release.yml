name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing tag or branch to build and publish"
        required: true
        type: string
      launchpad_series:
        description: "Optional Ubuntu series for a series-targeted Launchpad source package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.release_ref || github.ref }}

  certification:
    name: Real compositor certification
    uses: ./.github/workflows/certification.yml
    with:
      checkout_ref: ${{ inputs.release_ref || github.ref }}

  linux-aarch64:
    name: Linux aarch64 release
    needs: [ci, certification]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build release binaries natively on arm64
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p action-broker -p wayexpand-ui -p wayexpand-gui -p wayexpand-backend-ibus
      - name: Package aarch64 release
        run: scripts/package-release-binaries.sh "${RELEASE_REF_NAME#v}" aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayexpand-linux-aarch64
          path: |
            wayexpand-*-linux-aarch64.tar.gz
            wayexpand-*-linux-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2

  linux-x86_64:
    name: Linux x86_64 release
    needs: [ci, certification, linux-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build and package dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config build-essential debhelper devscripts dpkg-dev rpm
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor --locked vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Verify version consistency across all sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ release refs must use a SemVer tag vX.Y.Z (got $RELEASE_REF_NAME)" >&2
            exit 1
          fi
          expected="${RELEASE_REF_NAME#v}"

          # Check Cargo.toml
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$cargo_version" = "$expected" || {
            echo "❌ Cargo.toml version ($cargo_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check debian/changelog (Launchpad PPA uses this)
          changelog_version=$(dpkg-parsechangelog --show-field Version)
          changelog_upstream="${changelog_version%%-*}"
          test "$changelog_upstream" = "$expected" || {
            echo "❌ debian/changelog version ($changelog_version) does not match tag ($expected)" >&2
            echo "Launchpad builds from debian/changelog, not this tag." >&2
            exit 1
          }

          # Check PKGBUILD (Arch Linux AUR uses this)
          pkgbuild_version=$(sed -n 's/^pkgver=\([^"]*\)/\1/p' PKGBUILD)
          test "$pkgbuild_version" = "$expected" || {
            echo "❌ PKGBUILD pkgver ($pkgbuild_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check RPM spec (Fedora Copr uses this)
          spec_version=$(sed -n 's/^Version: *\([^ ]*\)/\1/p' wayexpand.spec)
          test "$spec_version" = "$expected" || {
            echo "❌ wayexpand.spec Version ($spec_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Desktop integration metadata must ship the same release.
          appstream_version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' io.github.cyberducttape.WayExpand.metainfo.xml | head -n1)
          test "$appstream_version" = "$expected" || {
            echo "❌ AppStream release version ($appstream_version) does not match tag ($expected)" >&2
            exit 1
          }
          ibus_version=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' desktop/wayexpand-ibus.xml | head -n1)
          test "$ibus_version" = "$expected" || {
            echo "❌ IBus component version ($ibus_version) does not match tag ($expected)" >&2
            exit 1
          }

          echo "✓ Version consistency verified: $expected"
          echo "  ✓ Cargo.toml: $cargo_version"
          echo "  ✓ debian/changelog: $changelog_upstream"
          echo "  ✓ PKGBUILD: $pkgbuild_version"
          echo "  ✓ wayexpand.spec: $spec_version"
      - name: Verify release ancestry
        run: bash scripts/check-release-ancestry.sh "$RELEASE_REF_NAME"
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p action-broker -p wayexpand-ui -p wayexpand-gui -p wayexpand-backend-ibus
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wayexpand-linux-aarch64
      - name: Package x86_64 release
        run: scripts/package-release-binaries.sh "${RELEASE_REF_NAME#v}" x86_64
      - name: Generate Cargo metadata
        run: cargo metadata --locked --format-version 1 > "wayexpand-${RELEASE_REF_NAME#v}.cargo-metadata.json"
      - name: Build Debian and RPM packages
        run: scripts/build-release-packages.sh "${RELEASE_REF_NAME#v}"
      - name: Generate source tarballs (clean + vendored)
        run: bash scripts/generate-release-tarballs.sh "${RELEASE_REF_NAME#v}"
      - name: Verify source archive checksum and vendored Debian inputs
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_REF_NAME#v}"
          expected_checksum=$(awk -F"'" '/^sha256sums=/ { print $2; exit }' PKGBUILD)
          actual_checksum=$(sha256sum "wayexpand-${version}.tar.gz" | awk '{print $1}')
          test -n "$expected_checksum"
          test "$expected_checksum" = "$actual_checksum" || {
            echo "PKGBUILD checksum does not match the clean source archive" >&2
            exit 1
          }
          tar -tzf "wayexpand-${version}-vendored.tar.gz" \
            | grep -F "wayexpand-${version}/debian/rules" >/dev/null
          tar -tzf "wayexpand-${version}-vendored.tar.gz" \
            | grep -F "wayexpand-${version}/.cargo/config.toml" >/dev/null
          tar -tzf "wayexpand-${version}-vendored.tar.gz" \
            | grep -E "^wayexpand-${version}/vendor/[^/]+/\.cargo-checksum\.json$" >/dev/null
      - name: Build unsigned Launchpad source package
        if: ${{ inputs.launchpad_series != '' }}
        run: bash scripts/build-launchpad-source.sh "${RELEASE_REF_NAME#v}" "${{ inputs.launchpad_series }}"
      - name: Generate SBOM (Software Bill of Materials)
        shell: bash
        run: |
          set -euo pipefail
          # Syft is fetched from an immutable release asset and verified against
          # Anchore's published SHA-256 before execution. Do not replace this
          # with the mutable install.sh on main.
          syft_version=1.52.0
          syft_sha256=caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
          syft_archive="$RUNNER_TEMP/syft_${syft_version}_linux_amd64.tar.gz"
          syft_bin="$RUNNER_TEMP/syft"
          curl --fail --silent --show-error --location \
            --output "$syft_archive" \
            "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$syft_sha256" "$syft_archive" | sha256sum --check --status
          tar --extract --gzip --file="$syft_archive" --directory="$RUNNER_TEMP"
          test -x "$syft_bin"
          version="${RELEASE_REF_NAME#v}"
          extract_dir="$RUNNER_TEMP/wayexpand-extract"

          # Extract clean source tarball and scan
          mkdir -p "$extract_dir/clean"
          tar -xzf "wayexpand-${version}.tar.gz" -C "$extract_dir/clean"
          "$syft_bin" "dir:$extract_dir/clean/wayexpand-${version}" \
            --output=spdx-json \
            --file="wayexpand-${version}.sbom.spdx.json"

          # Generate SBOM for packaged binary artifacts (CycloneDX JSON format)
          "$syft_bin" "dir:wayexpand-${version}-linux-x86_64/bin" \
            --output=cyclonedx-json \
            --file="wayexpand-${version}.sbom.cyclonedx.json"

          # Extract vendored tarball and scan
          mkdir -p "$extract_dir/vendored"
          tar -xzf "wayexpand-${version}-vendored.tar.gz" -C "$extract_dir/vendored"
          "$syft_bin" "dir:$extract_dir/vendored/wayexpand-${version}/vendor" \
            --output=spdx-json \
            --file="wayexpand-${version}-vendored.sbom.spdx.json"

          # Clean up extraction temporary directory
          rm -rf "$extract_dir"

          echo "✓ SBOMs generated from release artifacts:"
          echo "  - wayexpand-${version}.sbom.spdx.json (clean source)"
          echo "  - wayexpand-${version}.sbom.cyclonedx.json (binary artifacts)"
          echo "  - wayexpand-${version}-vendored.sbom.spdx.json (vendored dependencies)"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            wayexpand-*.tar.gz
            wayexpand_*.deb
            wayexpand-*.rpm
            wayexpand-*.cargo-metadata.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@71d29a04ae7c63895f38299d7a5e05d238f7f445 # v2.5.1
        with:
          generate_release_notes: true
          files: |
            wayexpand-*.tar.gz
            wayexpand-*.sha256
            wayexpand_*.dsc
            wayexpand_*.orig.tar.gz
            wayexpand_*.debian.tar.xz
            wayexpand_*_source.changes
            wayexpand_*_source.buildinfo
            wayexpand-*.cargo-metadata.json
            wayexpand-*.sbom.spdx.json
            wayexpand-*.sbom.cyclonedx.json
            wayexpand_*.deb
            wayexpand_*.deb.sha256
            wayexpand-*.rpm
            wayexpand-*.rpm.sha256
