name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  linux-x86_64:
    name: Linux x86_64 release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Verify version consistency across all sources
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"

          # Check Cargo.toml
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$cargo_version" = "$expected" || {
            echo "❌ Cargo.toml version ($cargo_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check debian/changelog (Launchpad PPA uses this)
          changelog_version=$(dpkg-parsechangelog --show-field Version)
          changelog_upstream="${changelog_version%%-*}"
          test "$changelog_upstream" = "$expected" || {
            echo "❌ debian/changelog version ($changelog_version) does not match tag ($expected)" >&2
            echo "Launchpad builds from debian/changelog, not this tag." >&2
            exit 1
          }

          # Check PKGBUILD (Arch Linux AUR uses this)
          pkgbuild_version=$(sed -n 's/^pkgver=\([^"]*\)/\1/p' PKGBUILD)
          test "$pkgbuild_version" = "$expected" || {
            echo "❌ PKGBUILD pkgver ($pkgbuild_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check RPM spec (Fedora Copr uses this)
          spec_version=$(sed -n 's/^Version: *\([^ ]*\)/\1/p' wayexpand.spec)
          test "$spec_version" = "$expected" || {
            echo "❌ wayexpand.spec Version ($spec_version) does not match tag ($expected)" >&2
            exit 1
          }

          echo "✓ Version consistency verified: $expected"
          echo "  ✓ Cargo.toml: $cargo_version"
          echo "  ✓ debian/changelog: $changelog_upstream"
          echo "  ✓ PKGBUILD: $pkgbuild_version"
          echo "  ✓ wayexpand.spec: $spec_version"
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p wayexpand-ui -p wayexpand-gui
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="wayexpand-${version}-linux-x86_64"
          mkdir -p "$root/bin" "$root/systemd" "$root/desktop" "$root/docs" "$root/scripts" "$root/udev"
          install -m 0755 target/release/wayexpand "$root/bin/"
          install -m 0755 target/release/wayexpand-daemon "$root/bin/"
          install -m 0755 target/release/wayexpand-ui "$root/bin/"
          install -m 0755 target/release/wayexpand-gui "$root/bin/"
          install -m 0644 systemd/*.service "$root/systemd/"
          install -m 0644 desktop/wayexpand.desktop "$root/desktop/"
          install -m 0644 io.github.itchyitchy123.WayExpand.metainfo.xml "$root/"
          install -m 0644 docs/wayexpand.1 "$root/docs/"
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            mkdir -p "$root/icons/hicolor/$size/apps"
            install -m 0644 "assets/icon/hicolor/$size/apps/wayexpand.png" \
              "$root/icons/hicolor/$size/apps/wayexpand.png"
          done
          install -m 0644 README.md LICENSE SECURITY.md CHANGELOG.md "$root/"
          install -m 0600 expansions.toml "$root/expansions.toml"
          install -m 0755 scripts/install-release.sh "$root/scripts/"
          install -m 0755 scripts/uninstall-user.sh "$root/scripts/"
          install -m 0755 scripts/install-evdev-permissions.sh "$root/scripts/"
          install -m 0644 udev/71-wayexpand-evdev.rules "$root/udev/"
          cp -R docs/. "$root/docs/"
          tar -czf "${root}.tar.gz" "$root"
          sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
          cargo metadata --locked --format-version 1 > "${root}.cargo-metadata.json"
      - name: Generate SBOM (Software Bill of Materials)
        run: |
          # Install syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          version="${GITHUB_REF_NAME#v}"

          # Generate SBOM for source tarball (SPDX format)
          /usr/local/bin/syft "dir:." \
            --output=spdx-json \
            --file="wayexpand-${version}.sbom.spdx.json"

          # Generate SBOM for binary artifacts (CycloneDX JSON format, for tool compatibility)
          /usr/local/bin/syft "dir:." \
            --output=cyclonedx-json \
            --file="wayexpand-${version}.sbom.cyclonedx.json"

          # Generate SBOM for vendored dependencies
          /usr/local/bin/syft "dir:vendor" \
            --output=spdx-json \
            --file="wayexpand-${version}-vendored.sbom.spdx.json"

          echo "✓ SBOMs generated:"
          echo "  - wayexpand-${version}.sbom.spdx.json"
          echo "  - wayexpand-${version}.sbom.cyclonedx.json"
          echo "  - wayexpand-${version}-vendored.sbom.spdx.json"
      - name: Generate source tarballs (clean + vendored)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Clean tarball (Cargo.lock only)
          git archive --format=tar.gz \
            --prefix="wayexpand-${version}/" \
            --output="wayexpand-${version}.tar.gz" \
            HEAD
          sha256sum "wayexpand-${version}.tar.gz" > "wayexpand-${version}.tar.gz.sha256"
          cargo metadata --locked --format-version 1 > "wayexpand-${version}.cargo-metadata.json"

          # Vendored tarball (with vendor/ for offline builds)
          mkdir -p /tmp/wayexpand-vendor-build
          cd /tmp/wayexpand-vendor-build
          tar -xzf "$GITHUB_WORKSPACE/wayexpand-${version}.tar.gz"
          cd "wayexpand-${version}"
          mkdir -p .cargo
          cargo vendor vendor/ > .cargo/config.toml
          cd ..
          tar -czf "$GITHUB_WORKSPACE/wayexpand-${version}-vendored.tar.gz" "wayexpand-${version}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "wayexpand-${version}-vendored.tar.gz" > "wayexpand-${version}-vendored.tar.gz.sha256"
          rm -rf /tmp/wayexpand-vendor-build
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            wayexpand-*.tar.gz
            wayexpand-*.cargo-metadata.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@71d29a04ae7c63895f38299d7a5e05d238f7f445 # v2.5.1
        with:
          generate_release_notes: true
          files: |
            wayexpand-*.tar.gz
            wayexpand-*.sha256
            wayexpand-*.cargo-metadata.json
            wayexpand-*.sbom.spdx.json
            wayexpand-*.sbom.cyclonedx.json
