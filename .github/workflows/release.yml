name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  linux-x86_64:
    name: Linux x86_64 release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Generate vendored dependencies (offline builds)
        run: mkdir -p .cargo && cargo vendor --locked vendor/ > .cargo/config.toml && echo "vendor/" >> .gitignore
      - name: Verify version consistency across all sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ release tags must use SemVer vX.Y.Z (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"

          # Check Cargo.toml
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$cargo_version" = "$expected" || {
            echo "❌ Cargo.toml version ($cargo_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check debian/changelog (Launchpad PPA uses this)
          changelog_version=$(dpkg-parsechangelog --show-field Version)
          changelog_upstream="${changelog_version%%-*}"
          test "$changelog_upstream" = "$expected" || {
            echo "❌ debian/changelog version ($changelog_version) does not match tag ($expected)" >&2
            echo "Launchpad builds from debian/changelog, not this tag." >&2
            exit 1
          }

          # Check PKGBUILD (Arch Linux AUR uses this)
          pkgbuild_version=$(sed -n 's/^pkgver=\([^"]*\)/\1/p' PKGBUILD)
          test "$pkgbuild_version" = "$expected" || {
            echo "❌ PKGBUILD pkgver ($pkgbuild_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check RPM spec (Fedora Copr uses this)
          spec_version=$(sed -n 's/^Version: *\([^ ]*\)/\1/p' wayexpand.spec)
          test "$spec_version" = "$expected" || {
            echo "❌ wayexpand.spec Version ($spec_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Desktop integration metadata must ship the same release.
          appstream_version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' io.github.cyberducttape.WayExpand.metainfo.xml | head -n1)
          test "$appstream_version" = "$expected" || {
            echo "❌ AppStream release version ($appstream_version) does not match tag ($expected)" >&2
            exit 1
          }
          ibus_version=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' desktop/wayexpand-ibus.xml | head -n1)
          test "$ibus_version" = "$expected" || {
            echo "❌ IBus component version ($ibus_version) does not match tag ($expected)" >&2
            exit 1
          }

          echo "✓ Version consistency verified: $expected"
          echo "  ✓ Cargo.toml: $cargo_version"
          echo "  ✓ debian/changelog: $changelog_upstream"
          echo "  ✓ PKGBUILD: $pkgbuild_version"
          echo "  ✓ wayexpand.spec: $spec_version"
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p wayexpand-ui -p wayexpand-gui -p wayexpand-backend-ibus
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="wayexpand-${version}-linux-x86_64"
          mkdir -p "$root/bin" "$root/systemd" "$root/desktop" "$root/docs" "$root/scripts" "$root/udev" "$root/ibus/component"
          install -m 0755 target/release/wayexpand "$root/bin/"
          install -m 0755 target/release/wayexpand-daemon "$root/bin/"
          install -m 0755 target/release/wayexpand-ui "$root/bin/"
          install -m 0755 target/release/wayexpand-gui "$root/bin/"
          install -m 0755 target/release/wayexpand-ibus "$root/bin/"
          install -m 0644 systemd/wayexpand-input-method.service systemd/wayexpand-evdev.service "$root/systemd/"
          install -m 0644 desktop/wayexpand.desktop "$root/desktop/"
          install -m 0644 desktop/wayexpand-ibus.xml "$root/ibus/component/"
          install -m 0644 io.github.cyberducttape.WayExpand.metainfo.xml "$root/"
          install -m 0644 docs/wayexpand.1 "$root/docs/"
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            mkdir -p "$root/icons/hicolor/$size/apps"
            install -m 0644 "assets/icon/hicolor/$size/apps/wayexpand.png" \
              "$root/icons/hicolor/$size/apps/wayexpand.png"
          done
          install -m 0644 README.md LICENSE SECURITY.md CHANGELOG.md "$root/"
          install -m 0600 expansions.toml "$root/expansions.toml"
          install -m 0755 scripts/install-release.sh "$root/scripts/"
          install -m 0755 scripts/uninstall-user.sh "$root/scripts/"
          install -m 0755 scripts/install-evdev-permissions.sh "$root/scripts/"
          install -m 0644 udev/71-wayexpand-evdev.rules "$root/udev/"
          install -m 0644 udev/69-wayexpand-evdev-uaccess.rules "$root/udev/"
          cp -R docs/. "$root/docs/"
          tar -czf "${root}.tar.gz" "$root"
          sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
          cargo metadata --locked --format-version 1 > "${root}.cargo-metadata.json"
      - name: Generate source tarballs (clean + vendored)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Clean source archive: lockfile included, no vendored source redirect.
          git archive --format=tar.gz \
            --prefix="wayexpand-${version}/" \
            --output="wayexpand-${version}.tar.gz" \
            HEAD
          if tar -tzf "wayexpand-${version}.tar.gz" | grep -E '^wayexpand-[^/]+/(\.cargo/config\.toml|vendor/)' >/dev/null; then
            echo "clean source archive unexpectedly contains vendored Cargo configuration or vendor/" >&2
            exit 1
          fi
          sha256sum "wayexpand-${version}.tar.gz" > "wayexpand-${version}.tar.gz.sha256"
          cargo metadata --locked --format-version 1 > "wayexpand-${version}.cargo-metadata.json"

          # Vendored tarball (with vendor/ for offline builds)
          mkdir -p /tmp/wayexpand-vendor-build
          cd /tmp/wayexpand-vendor-build
          tar -xzf "$GITHUB_WORKSPACE/wayexpand-${version}.tar.gz"
          cd "wayexpand-${version}"
          mkdir -p .cargo
          cargo vendor --locked vendor/ > .cargo/config.toml
          cd ..
          tar -czf "$GITHUB_WORKSPACE/wayexpand-${version}-vendored.tar.gz" "wayexpand-${version}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "wayexpand-${version}-vendored.tar.gz" > "wayexpand-${version}-vendored.tar.gz.sha256"
          rm -rf /tmp/wayexpand-vendor-build
      - name: Generate SBOM (Software Bill of Materials)
        shell: bash
        run: |
          set -euo pipefail
          # Syft is fetched from an immutable release asset and verified against
          # Anchore's published SHA-256 before execution. Do not replace this
          # with the mutable install.sh on main.
          syft_version=1.52.0
          syft_sha256=caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
          syft_archive="$RUNNER_TEMP/syft_${syft_version}_linux_amd64.tar.gz"
          syft_bin="$RUNNER_TEMP/syft"
          curl --fail --silent --show-error --location \
            --output "$syft_archive" \
            "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$syft_sha256" "$syft_archive" | sha256sum --check --status
          tar --extract --gzip --file="$syft_archive" --directory="$RUNNER_TEMP"
          test -x "$syft_bin"
          version="${GITHUB_REF_NAME#v}"
          extract_dir="$RUNNER_TEMP/wayexpand-extract"

          # Extract clean source tarball and scan
          mkdir -p "$extract_dir/clean"
          tar -xzf "wayexpand-${version}.tar.gz" -C "$extract_dir/clean"
          "$syft_bin" "dir:$extract_dir/clean/wayexpand-${version}" \
            --output=spdx-json \
            --file="wayexpand-${version}.sbom.spdx.json"

          # Generate SBOM for packaged binary artifacts (CycloneDX JSON format)
          "$syft_bin" "dir:wayexpand-${version}-linux-x86_64/bin" \
            --output=cyclonedx-json \
            --file="wayexpand-${version}.sbom.cyclonedx.json"

          # Extract vendored tarball and scan
          mkdir -p "$extract_dir/vendored"
          tar -xzf "wayexpand-${version}-vendored.tar.gz" -C "$extract_dir/vendored"
          "$syft_bin" "dir:$extract_dir/vendored/wayexpand-${version}/vendor" \
            --output=spdx-json \
            --file="wayexpand-${version}-vendored.sbom.spdx.json"

          # Clean up extraction temporary directory
          rm -rf "$extract_dir"

          echo "✓ SBOMs generated from release artifacts:"
          echo "  - wayexpand-${version}.sbom.spdx.json (clean source)"
          echo "  - wayexpand-${version}.sbom.cyclonedx.json (binary artifacts)"
          echo "  - wayexpand-${version}-vendored.sbom.spdx.json (vendored dependencies)"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            wayexpand-*.tar.gz
            wayexpand-*.cargo-metadata.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@71d29a04ae7c63895f38299d7a5e05d238f7f445 # v2.5.1
        with:
          generate_release_notes: true
          files: |
            wayexpand-*.tar.gz
            wayexpand-*.sha256
            wayexpand-*.cargo-metadata.json
            wayexpand-*.sbom.spdx.json
            wayexpand-*.sbom.cyclonedx.json
