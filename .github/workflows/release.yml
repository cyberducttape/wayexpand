name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux ${{ matrix.arch }} release
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Verify version consistency across all sources
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"

          # Check Cargo.toml
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$cargo_version" = "$expected" || {
            echo "❌ Cargo.toml version ($cargo_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check debian/changelog (Launchpad PPA uses this)
          changelog_version=$(dpkg-parsechangelog --show-field Version)
          changelog_upstream="${changelog_version%%-*}"
          test "$changelog_upstream" = "$expected" || {
            echo "❌ debian/changelog version ($changelog_version) does not match tag ($expected)" >&2
            echo "Launchpad builds from debian/changelog, not this tag." >&2
            exit 1
          }

          # Check PKGBUILD (Arch Linux AUR uses this)
          pkgbuild_version=$(sed -n 's/^pkgver=\([^"]*\)/\1/p' PKGBUILD)
          test "$pkgbuild_version" = "$expected" || {
            echo "❌ PKGBUILD pkgver ($pkgbuild_version) does not match tag ($expected)" >&2
            exit 1
          }

          # Check RPM spec (Fedora Copr uses this)
          spec_version=$(sed -n 's/^Version: *\([^ ]*\)/\1/p' wayexpand.spec)
          test "$spec_version" = "$expected" || {
            echo "❌ wayexpand.spec Version ($spec_version) does not match tag ($expected)" >&2
            exit 1
          }

          echo "✓ Version consistency verified: $expected"
          echo "  ✓ Cargo.toml: $cargo_version"
          echo "  ✓ debian/changelog: $changelog_upstream"
          echo "  ✓ PKGBUILD: $pkgbuild_version"
          echo "  ✓ wayexpand.spec: $spec_version"
      - name: Build release binaries
        run: cargo build --locked --release -p wayexpand -p wayexpand-daemon -p wayexpand-ui -p wayexpand-gui
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="wayexpand-${version}-linux-${{ matrix.arch }}"
          mkdir -p "$root/bin" "$root/systemd" "$root/desktop" "$root/docs" "$root/scripts" "$root/udev"
          install -m 0755 target/release/wayexpand "$root/bin/"
          install -m 0755 target/release/wayexpand-daemon "$root/bin/"
          install -m 0755 target/release/wayexpand-ui "$root/bin/"
          install -m 0755 target/release/wayexpand-gui "$root/bin/"
          install -m 0644 systemd/*.service "$root/systemd/"
          install -m 0644 desktop/wayexpand.desktop "$root/desktop/"
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            mkdir -p "$root/icons/hicolor/$size/apps"
            install -m 0644 "assets/icon/hicolor/$size/apps/wayexpand.png" \
              "$root/icons/hicolor/$size/apps/wayexpand.png"
          done
          install -m 0644 README.md LICENSE SECURITY.md CHANGELOG.md "$root/"
          install -m 0600 expansions.toml "$root/expansions.toml"
          install -m 0755 scripts/install-release.sh "$root/scripts/"
          install -m 0755 scripts/uninstall-user.sh "$root/scripts/"
          install -m 0755 scripts/install-evdev-permissions.sh "$root/scripts/"
          install -m 0644 udev/71-wayexpand-evdev.rules "$root/udev/"
          cp -R docs/. "$root/docs/"
          tar -czf "${root}.tar.gz" "$root"
          sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            wayexpand-*.tar.gz
            wayexpand-*.sha256
