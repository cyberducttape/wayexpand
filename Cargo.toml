[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/ui",
    "crates/gui",
    "crates/cli",
    "crates/backend-wlroots",
    "crates/backend-input-method",
    "crates/backend-libei",
    "crates/backend-evdev",
    "crates/backend-kwin-window",
    "crates/backend-selection",
    "crates/backend-ibus",
    "crates/action-broker",
    "crates/broker-protocol",
    "crates/broker-client",
    "crates/process-supervisor",
    "crates/build-info",
]

[workspace.package]
version = "1.3.3"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A privacy-first, Wayland-native text expander for Linux"
repository = "https://github.com/cyberducttape/wayexpand"
homepage = "https://github.com/cyberducttape/wayexpand"
readme = "README.md"
keywords = ["wayland", "text-expansion", "snippets", "automation", "productivity"]
categories = ["command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
crossterm = "0.29"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
rustix = { version = "1", features = ["process"] }
libc = "0.2"
sha2 = "0.11"
notify = "8.2"
wayland-client = "0.31"
wayland-protocols = "0.32.13"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon-rs = { version = "0.1.2", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-general-category = "1.1"
shlex = "2"
semver = "1"
async-io = "2"
futures-lite = "2"
