[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/ui",
    "crates/gui",
    "crates/cli",
    "crates/backend-wlroots",
    "crates/backend-input-method",
    "crates/backend-libei",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
crossterm = "0.29"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.3"
rustix = { version = "1", features = ["process"] }
wayland-client = "0.31"
wayland-protocols = "0.32.13"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon-rs = { version = "0.1.2", features = ["client"] }
