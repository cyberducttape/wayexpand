[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/ui",
    "crates/gui",
    "crates/cli",
    "crates/backend-wlroots",
    "crates/backend-input-method",
    "crates/backend-libei",
    "crates/backend-evdev",
    "crates/backend-clipboard",
    "crates/backend-kwin-window",
    "crates/backend-selection",
    "crates/backend-ibus",
]

[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "A privacy-first, Wayland-native text expander for Linux"
repository = "https://github.com/itchyitchy123/wayexpand"
homepage = "https://github.com/itchyitchy123/wayexpand"
readme = "README.md"
keywords = ["wayland", "text-expansion", "snippets", "automation", "productivity"]
categories = ["command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
crossterm = "0.29"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
rustix = { version = "1", features = ["process"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = "0.32.13"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon-rs = { version = "0.1.2", features = ["client"] }
unicode-segmentation = "1"
