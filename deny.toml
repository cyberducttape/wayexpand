# cargo-deny policy for WayExpand.
#
# This complements `cargo audit`: audit catches known vulnerabilities, while
# cargo-deny also reviews license policy, duplicate versions, banned crates,
# and allowed dependency sources.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# zvariant, zvariant_derive and zbus_names (RUSTSEC-2026-0370/-0371/-0372,
# "unmaintained", not vulnerabilities) were folded into zbus 6. The zbus 5
# line still uses them, and both zbus 5 consumers here are upstream: ashpd
# 0.13 (the libei portal) and egui's AT-SPI accessibility stack. Drop these
# once ashpd and atspi release on zbus 6 and the lockfile moves.
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Unlicense",
    "Zlib",
]

exceptions = [
    # egui-winit's Windows clipboard backend pulls these under BSL-1.0,
    # an OSI-approved, non-copyleft license. Pin allowances to locked versions.
    { name = "clipboard-win", version = "5.4.3", allow = ["BSL-1.0"] },
    { name = "error-code", version = "3.4.0", allow = ["BSL-1.0"] },
]

[[licenses.clarify]]
# xkbcommon-rs 0.1.2 ships a LICENSE file derived from libxkbcommon's
# MIT/X11-style terms but does not publish a license expression in its Cargo
# manifest. cargo-deny reported this file hash during local validation.
crate = "xkbcommon-rs@0.1.2"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0xacb18c30 },
]

[bans]
# Existing duplicates are explicitly baselined in `skip` below. New duplicate
# groups should be reviewed instead of silently entering the lockfile.
multiple-versions = "warn"

# Workspace crates use local path dependencies without explicit versions.
# External dependency versions are still governed by Cargo.lock and
# `cargo --locked` in CI.
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    # Reviewed 2026-09-24: current duplicate baseline from GUI/Wayland,
    # parser-generator, platform, and compatibility transitive dependencies.
    # Keep this list explicit so newly introduced duplicate crates are reported.
    "bitflags@1.3.2",
    "cfg_aliases@0.1.1",
    "convert_case@0.6.0",
    "getrandom@0.2.17",
    "getrandom@0.3.4",
    "jni-sys@0.3.1",
    "linux-raw-sys@0.4.15",
    "miniz_oxide@0.8.9",
    "nix@0.28.0",
    "objc2@0.5.2",
    "objc2-app-kit@0.2.2",
    "objc2-foundation@0.2.2",
    "r-efi@5.3.0",
    "redox_syscall@0.4.1",
    "redox_syscall@0.5.18",
    "redox_users@0.4.6",
    "redox_users@0.5.3",
    "rustix@0.38.44",
    "signal-hook@0.3.18",
    "syn@2.0.119",
    "thiserror@1.0.69",
    "thiserror-impl@1.0.69",
    "windows-sys@0.52.0",
    "windows-sys@0.59.0",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
