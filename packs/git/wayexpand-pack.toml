format_version = 1
id = "wayexpand.git"
version = "1.1.0"
name = "Git Workflows"
publisher = "WayExpand project"
maintainer = "WayExpand Git Pack Maintainers"
description = "Review-first Git commands and collaborative workflow templates."
capabilities = ["forms"]

[compatibility]
shells = ["bash", "zsh", "fish"]
platforms = ["linux", "any"]
tools = ["git"]

[risk]
level = "low"
summary = "Commands inspect repository state; no commit, reset, checkout, push, or ref update is automatic."

[review]
reviewed_by = "WayExpand project review"
reviewed_at = "2026-11-02"
summary = "Reviewed by WayExpand Git Pack Maintainers; content is inserted as text and never run by WayExpand. Review command targets and outputs before manual use."

[verification]
test_cases = "tests/cases.toml"
