[[expansion]]
trigger = ";;journal-service"
description = "Inspect recent service logs without following or modifying the unit"
category = "Linux operations"
tags = ["systemd", "journalctl"]
replacement = "journalctl --user -u {{shellq:unit=example.service|required|max=255|validate=systemd-unit}} --since {{shellq:since=1 hour ago|required|max=80}} --no-pager -n {{shellq:lines=100|required|max=5|validate=positive-integer}}"

[[expansion]]
trigger = ";;service-status"
description = "Check a system service's current state"
category = "Linux operations"
tags = ["systemd", "status"]
replacement = "systemctl status --no-pager -- {{shellq:unit=example.service|required|max=255|validate=systemd-unit}}"

[[expansion]]
trigger = ";;ssh-check"
description = "Run a read-only remote host identity and uptime check"
category = "Linux operations"
tags = ["ssh", "diagnostics"]
replacement = "ssh {{shellq:user=admin|required|max=32|validate=linux-user}}@{{shellq:host=host.example.net|required|max=253|validate=hostname}} 'hostname -f; uptime'"

[[expansion]]
trigger = ";;bash-safe"
description = "Bash script starter with strict mode and explicit argument validation"
category = "Linux operations"
tags = ["bash", "shell"]
replacement = """#!/usr/bin/env bash
set -Eeuo pipefail

main() {
    local target="{{field:target=/path/to/target}}"
    printf 'Review target before continuing: %s\\n' \"$target\"
}

main \"$@\"
"""

[[expansion]]
trigger = ";;systemd-unit"
description = "Hardened user service unit starter"
category = "Linux operations"
tags = ["systemd", "unit"]
replacement = """[Unit]
Description={{field:description=Example user service}}

[Service]
Type=simple
ExecStart={{field:executable=/usr/bin/example}} {{field:arguments=--foreground}}
Restart=on-failure
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only

[Install]
WantedBy=default.target
"""
