format_version = 1
id = "wayexpand.linux-administration"
version = "1.1.0"
name = "Linux Administration"
publisher = "WayExpand project"
maintainer = "WayExpand Linux Pack Maintainers"
description = "Parameterized, insert-only templates for Bash, SSH, systemd, and journalctl."
capabilities = ["forms"]

[compatibility]
shells = ["bash", "zsh", "fish"]
platforms = ["linux"]
tools = ["systemctl", "journalctl", "ssh"]

[risk]
level = "moderate"
summary = "Templates may target privileged or remote systems when manually run; fields must be reviewed and WayExpand only inserts text."

[review]
reviewed_by = "WayExpand project review"
reviewed_at = "2026-11-02"
summary = "Reviewed by WayExpand Linux Pack Maintainers; content is inserted as text and never run by WayExpand. Review command targets and outputs before manual use."

[verification]
test_cases = "tests/cases.toml"
