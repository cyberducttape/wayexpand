format_version = 1
id = "wayexpand.docker"
version = "1.1.0"
name = "Docker and Podman"
publisher = "WayExpand project"
maintainer = "WayExpand Container Pack Maintainers"
description = "Docker and Podman inspection and Compose validation templates."
capabilities = ["forms"]

[compatibility]
shells = ["bash", "zsh", "fish"]
platforms = ["linux"]
tools = ["docker", "podman"]

[risk]
level = "low"
summary = "Inspection and validation commands are read-only; generated Compose files can change services only when separately applied."

[review]
reviewed_by = "WayExpand project review"
reviewed_at = "2026-11-02"
summary = "Reviewed by WayExpand Container Pack Maintainers; content is inserted as text and never run by WayExpand. Review command targets and outputs before manual use."

[verification]
test_cases = "tests/cases.toml"
