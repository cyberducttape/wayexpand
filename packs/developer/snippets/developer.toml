[[expansion]]
trigger = ";;git-review"
description = "Review branch, staged and unstaged changes, and whitespace errors without modifying the worktree"
category = "Developer"
tags = ["git", "review"]
replacement = "git status --short --branch && git diff --check && git diff --cached --check && git diff --stat && git diff --cached --stat"

[[expansion]]
trigger = ";;git-log"
description = "Compact recent commit history for a selected branch"
category = "Developer"
tags = ["git", "history"]
replacement = "git log --oneline --decorate -{{shellq:count=12|required|max=5|validate=positive-integer}} {{shellq:ref=HEAD|required|max=255|validate=git-revision}}"

[[expansion]]
trigger = ";;sql-select"
description = "Parameterized read-only SQL query starter"
category = "Developer"
tags = ["sql", "database"]
replacement = """SELECT {{field:columns=*|required|validate=sql-identifier|max=512}}
FROM {{field:table=schema.table|required|validate=sql-identifier|max=256}}
WHERE {{field:condition=1 = 1|required|free_text=true|max=1024}}
ORDER BY {{field:sort_column=created_at|required|validate=sql-identifier|max=256}} DESC
LIMIT {{field:limit=100|required|validate=positive-integer|max=10}};
"""

[[expansion]]
trigger = ";;md-incident"
description = "Incident note template with a cursor in the first field"
category = "Developer"
tags = ["markdown", "incident"]
replacement = """## {{field:incident=Incident title}}{{cursor}}

- **Impact:** {{field:impact=Describe affected users or systems}}
- **Started:** {{field:started=UTC timestamp}}
- **Current status:** {{choice:status=Investigating|Mitigating|Monitoring|Resolved}}

### Timeline
- {{field:time=UTC}} — {{field:event=Update}}

### Next update
{{field:next_update=Time or condition}}
"""
