[package]
name = "wayexpand-gui"
description = "Native Wayland graphical editor for WayExpand"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
read-fonts = "0.45.0"
anyhow.workspace = true
libc.workspace = true
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "wayland", "default_fonts", "glow"] }
serde.workspace = true
serde_json.workspace = true
toml_edit = { version = "0.25.15", features = ["serde"] }
wayexpand-core = { path = "../core" }
wayexpand-process-supervisor = { path = "../process-supervisor" }
wayexpand-backend-ibus = { path = "../backend-ibus" }
wayexpand-backend-input-method = { path = "../backend-input-method" }
wayexpand-backend-wlroots = { path = "../backend-wlroots" }
wayexpand-backend-kwin-window = { path = "../backend-kwin-window" }
wayexpand-backend-selection = { path = "../backend-selection" }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[build-dependencies]
wayexpand-build-info = { path = "../build-info" }

[[bench]]
name = "gui_edit"
harness = false
