recovery_open_failed = "Tidak dapat dibuka: {error}"
recovery_relaunch_failed = "WayExpand tidak dapat dimulai ulang: {error}"
recovery_action_failed = "Itu tidak berhasil, dan tidak ada yang diganti: {error}"

[route_fit]
route_fit_too_long_hint = "Cuplikan ini mengetik {chars} karakter; jalur pengetikan Anda saat ini menerima paling banyak {max}. WayExpand menolaknya sebelum mengubah apa pun. Persingkat, naikkan keystroke_max_chars di Pengaturan, atau gunakan Pemilih Cepat untuk menempelkannya."
route_fit_cannot_type_hint = "Jalur pengetikan Anda saat ini tidak dapat mengetik karakter ke-{position} cuplikan ini. WayExpand menolaknya sebelum mengubah apa pun; gunakan Pemilih Cepat untuk menempelkannya, atau siapkan jalur dengan dukungan Unicode penuh."
