evdev_setup_warning = "Berfungsi di lebih banyak aplikasi, tetapi dapat mengamati pengetikan di kolom kata sandi karena mode ini tidak memiliki sinyal kolom sensitif. Ini adalah pilihan eksplisit. Izin perangkat merupakan perubahan terpisah di seluruh sistem dan tidak pernah dilakukan oleh GUI ini."
evdev_setup_acknowledge = "Saya memahami batasan masukan mentah dan kolom kata sandi"
evdev_setup_steps = "Jika akses perangkat papan ketik belum dikonfigurasi, selesaikan dahulu langkah izin administrator di Memulai. Lalu salin perintah di bawah ke terminal: perintah ini mengaktifkan layanan pengguna, dan desktop mungkin meminta Anda menyetujui portal masukan. Kembali ke sini, segarkan diagnostik, dan uji di kolom teks biasa."
onboarding_install_summary = "WayExpand GUI {version} sedang berjalan. Langkah berikutnya menjalankan layanan pengguna."
onboarding_test_state_save_failed = "Cuplikan uji ditambahkan, tetapi status penyiapannya tidak dapat disimpan: {error}"

[why]
why_title = "Mengapa pemicu saya tidak diperluas?"
why_intro = "Pratinjau matcher hanya memeriksa kecocokan aturan; itu tidak membuktikan teks sampai ke aplikasi. Hanya tes mengetik sungguhan yang dapat memverifikasi pengiriman. Teks yang diketik tidak pernah dicatat."
why_verified_app_scope = "Penyisipan nyata telah dikonfirmasi di {application}. Konfirmasi ini hanya berlaku untuk aplikasi yang diuji; jalankan tes mengetik langsung di aplikasi yang bermasalah."

