[package]
name = "wayexpand-daemon"
description = "Daemon runtime for the WayExpand text-expansion service"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
anyhow.workspace = true
libc.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
signal-hook.workspace = true
rustix = { workspace = true, features = ["process", "fs", "event", "net", "pipe"] }
wayexpand-core = { path = "../core" }
wayexpand-process-supervisor = { path = "../process-supervisor" }
wayexpand-backend-wlroots = { path = "../backend-wlroots" }
wayexpand-backend-libei = { path = "../backend-libei" }
wayexpand-backend-input-method = { path = "../backend-input-method" }
wayexpand-backend-evdev = { path = "../backend-evdev" }
wayexpand-backend-kwin-window = { path = "../backend-kwin-window" }
wayexpand-backend-gnome-window = { path = "../backend-gnome-window" }
wayexpand-backend-selection = { path = "../backend-selection" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
notify.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
async-io.workspace = true
futures-lite.workspace = true
xkbcommon-rs.workspace = true

[build-dependencies]
wayexpand-build-info = { path = "../build-info" }
