[package]
name = "wayexpand-core"
description = "Core matching and configuration engine for WayExpand"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
wayexpand-broker-client = { path = "../broker-client" }
wayexpand-process-supervisor = { path = "../process-supervisor" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
toml.workspace = true
rustix = { workspace = true, features = ["fs"] }
libc.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-general-category.workspace = true
getrandom.workspace = true

[features]
# Exposes the engine state-machine checker to the fuzz crate.
fuzzing = []

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "matcher"
harness = false

[[bench]]
name = "config_edit"
harness = false
