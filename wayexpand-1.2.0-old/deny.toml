# cargo-deny policy for WayExpand.
#
# This complements `cargo audit`: audit catches known vulnerabilities, while
# cargo-deny also reviews license policy, duplicate versions, banned crates,
# and allowed dependency sources.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# RUSTSEC-2026-0192 marks ttf-parser unmaintained. It is transitive through
# eframe 0.31's bundled GUI fonts and has no safe upgrade in that MSRV line;
# eframe 0.36 removes it but requires Rust 1.95, while WayExpand supports
# Rust 1.87. Keep this exception narrow and revisit it when an MSRV-compatible
# maintained eframe/font path becomes available.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Unlicense",
    "Zlib",
]

exceptions = []

[[licenses.clarify]]
# xkbcommon-rs 0.1.2 ships a LICENSE file derived from libxkbcommon's
# MIT/X11-style terms but does not publish a license expression in its Cargo
# manifest. cargo-deny reported this file hash during local validation.
crate = "xkbcommon-rs@0.1.2"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0xacb18c30 },
]

[bans]
# Existing duplicates are explicitly baselined in `skip` below. New duplicate
# groups should be reviewed instead of silently entering the lockfile.
multiple-versions = "warn"

# Workspace crates use local path dependencies without explicit versions.
# External dependency versions are still governed by Cargo.lock and
# `cargo --locked` in CI.
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    # Reviewed 2026-09-24: current duplicate baseline from GUI/Wayland,
    # parser-generator, platform, and compatibility transitive dependencies.
    # Keep this list explicit so newly introduced duplicate crates are reported.
    "bitflags@1.3.2",
    "calloop@0.13.0",
    "calloop-wayland-source@0.3.0",
    "cfg_aliases@0.1.1",
    "convert_case@0.6.0",
    "getrandom@0.2.17",
    "getrandom@0.3.4",
    "jni-sys@0.3.1",
    "linux-raw-sys@0.4.15",
    "miniz_oxide@0.8.9",
    "mio@0.8.11",
    "nix@0.28.0",
    "objc2@0.5.2",
    "objc2-app-kit@0.2.2",
    "objc2-foundation@0.2.2",
    "r-efi@5.3.0",
    "redox_syscall@0.4.1",
    "redox_syscall@0.5.18",
    "rustix@0.38.44",
    "signal-hook@0.3.18",
    "smithay-client-toolkit@0.19.2",
    "syn@2.0.119",
    "thiserror@1.0.69",
    "thiserror-impl@1.0.69",
    "windows-sys@0.48.0",
    "windows-sys@0.52.0",
    "windows-sys@0.59.0",
    "windows-sys@0.60.2",
    "windows-targets@0.48.5",
    "windows-targets@0.52.6",
    "windows_aarch64_gnullvm@0.48.5",
    "windows_aarch64_gnullvm@0.52.6",
    "windows_aarch64_msvc@0.48.5",
    "windows_aarch64_msvc@0.52.6",
    "windows_i686_gnu@0.48.5",
    "windows_i686_gnu@0.52.6",
    "windows_i686_gnullvm@0.52.6",
    "windows_i686_msvc@0.48.5",
    "windows_i686_msvc@0.52.6",
    "windows_x86_64_gnu@0.48.5",
    "windows_x86_64_gnu@0.52.6",
    "windows_x86_64_gnullvm@0.48.5",
    "windows_x86_64_gnullvm@0.52.6",
    "windows_x86_64_msvc@0.48.5",
    "windows_x86_64_msvc@0.52.6",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
