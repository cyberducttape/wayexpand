# Shared installation contract. `path` describes staged/package artifacts;
# IBus `registration` describes where the running daemon must find the shared
# component. Optional raw capture is consent-gated.
[components.cli]
path = "bin/wayexpand"
required = true

[components.gui]
path = "bin/wayexpand-gui"
required = true

[components.daemon]
path = "bin/wayexpand-daemon"
required = true

[components.ibus]
path = "ibus/wayexpand.xml"
package_path = "/usr/share/ibus/component/wayexpand-ibus.xml"
required = true
registration = "distribution packages install the shared component at package_path; source/archive installs use setup --backend ibus when registration is missing"
package_registration = "installed by the package manager; setup refreshes the running IBus registry only when needed"
user_registration = false
user_install_exec = "/usr/local/libexec/wayexpand/wayexpand-ibus"
user_install_exec_owner = "root"
package_install_exec = "wayexpand-ibus"
package_install_exec_path = "/usr/bin/wayexpand-ibus"
package_install_exec_owner = "package-manager"

[components.gnome_extension]
path = "gnome-extension/wayexpand-window-tracker@cyberducttape.github.io"
package_path = "/usr/share/gnome-shell/extensions/wayexpand-window-tracker@cyberducttape.github.io"
required = false
provisioning = "included in distribution packages; setup stages and enables a verified per-user copy"
activation = "per-user GNOME setting; a logout/login may be required for GNOME Shell to load a new extension"

[components.desktop]
path = "desktop/wayexpand.desktop"
required = true

[components.icon]
path = "icons/hicolor/128x128/apps/wayexpand.png"
required = true

[components.default_config_template]
path = "expansions.toml"
package_path = "/etc/wayexpand/expansions.toml.example"
required = true

[components.control_service]
path = "systemd/wayexpand-control.service"
required = true

[components.input_method_service]
path = "systemd/wayexpand-input-method.service"
required = true

[components.evdev_service]
path = "systemd/wayexpand-evdev.service"
required = false
requires_consent = true

[installation]
current_link = "~/.local/lib/wayexpand/current"
config = "${XDG_CONFIG_HOME:-~/.config}/wayexpand/expansions.toml"
user_units = "${XDG_CONFIG_HOME:-~/.config}/systemd/user"
binary_links = "~/.local/bin"
uninstall = "scripts/uninstall-user.sh"
upgrade = "content-addressed current symlink with previous-install rollback target"
path_note = "~/.local/bin must be present in PATH for per-user installs"
